<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swap — file converter</title>
<style>
:root{--bg:#eef2f0;--surface:#fff;--ink:#14201b;--muted:#5d6b64;--line:#cfd9d4;--accent:#0f6b52;--accent-ink:#fff;--warn:#a3341f;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1714;--surface:#17221d;--ink:#e7f0eb;--muted:#92a39a;--line:#2a3a33;--accent:#4fd1a5;--accent-ink:#06261b;--warn:#ff8f78}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(2.4rem,9vw,3.4rem);line-height:1;letter-spacing:-.03em;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 24px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;background:var(--surface);padding:28px 16px;text-align:center;cursor:pointer}
.drop.over,.drop:focus-within{border-color:var(--accent)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.card{margin-top:16px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.go{width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:14px;font:inherit;font-weight:600;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:4px;margin:26px 0 6px}
.bar i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.bar i.used{background:var(--accent)}
.msg{min-height:1.5em;margin:12px 0 0;color:var(--muted)}
.msg.err{color:var(--warn)}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>Swap</h1>
  <p class="sub">Convert images, documents, spreadsheets, slides, audio and video. 10 free conversions a day.</p>

  <label class="drop" id="drop">
    <input type="file" id="pick">
    <b>Choose a file</b><br><span class="sub" style="margin:0">or drop it here</span>
  </label>

  <section class="card hide" id="card">
    <div id="fname" style="font-weight:600;word-break:break-all"></div>
    <div class="chips" id="chips" role="group" aria-label="Convert to"></div>
    <button class="go" id="go" disabled>Convert</button>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <div class="bar" id="bar" aria-hidden="true"></div>
  <div id="left"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const ALIAS = { jpeg: 'jpg', tif: 'tiff' };
let groups = [], file = null, group = null, target = '', usage = { limit: 10, used: 0, left: 10 };

const ext = (n) => { const e = (n.split('.').pop() || '').toLowerCase(); return ALIAS[e] || e; };
const say = (t, err) => { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); };

function meter() {
  $('bar').innerHTML = Array.from({ length: usage.limit }, (_, i) => `<i class="${i < usage.used ? 'used' : ''}"></i>`).join('');
  $('left').textContent = usage.left > 0 ? `${usage.left} of ${usage.limit} conversions left today` : 'You’ve used all your free conversions today. Come back tomorrow.';
  $('go').disabled = !(file && group && target && usage.left > 0);
}
async function refreshUsage() { try { usage = await (await fetch('/api/usage')).json(); } catch {} meter(); }

function setFile(f) {
  if (!f) return;
  file = f; target = ''; say('');
  group = groups.find((g) => g.in.includes(ext(f.name)));
  $('card').classList.remove('hide');
  $('fname').textContent = f.name;
  if (!group) { $('chips').innerHTML = ''; say(`.${ext(f.name)} files aren’t supported.`, true); }
  else $('chips').innerHTML = group.out.filter((o) => o !== ext(f.name)).map((o) => `<button class="chip" aria-pressed="false" data-t="${o}">.${o}</button>`).join('');
  meter();
}

$('chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  target = b.dataset.t;
  document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
  meter();
});
$('pick').addEventListener('change', (e) => setFile(e.target.files[0]));
const drop = $('drop');
['dragenter', 'dragover'].forEach((v) => drop.addEventListener(v, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((v) => drop.addEventListener(v, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => setFile(e.dataTransfer.files[0]));

$('go').addEventListener('click', async () => {
  $('go').disabled = true; say('Converting… large files can take a while.');
  const body = new FormData();
  body.append('target', target);
  body.append('file', file);
  try {
    const res = await fetch('/api/convert', { method: 'POST', body });
    if (!res.ok) { say((await res.json().catch(() => ({}))).error || 'Conversion failed.', true); }
    else {
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = file.name.replace(/\.[^.]+$/, '') + '.' + target;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      say('Done. Your download should start now.');
    }
  } catch { say('Couldn’t reach the server.', true); }
  refreshUsage();
});

(async () => {
  try { groups = await (await fetch('/api/formats')).json(); } catch {}
  refreshUsage();
})();
</script>
</body>
</html>
